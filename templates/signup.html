<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup</title>
    <link rel="stylesheet" href="{{url_for('static',filename='css/styles.css')}}">
</head>
<body>
    <div class="sign-up">
      <form id="signup-form"> 
        <label >NAME</label>
       <input type="text" placeholder="enter your name" id="name-id">
       <label>EMAIL</label>
       <input type="email" placeholder="enter your email" id="email-id">

       <label>PASSWORD</label>
       <input type="password" placeholder="create your password" id="password-id">

       <button type="submit" class="primary-btn" id="primary-btn-id">Signup</button>
        <p id="error-msg" style="color: red; font-size: 14px;"></p>
        
       <p class="auth-switch">
        Already have an account.
        <a href="{{url_for('login')}}">login</a>
       </p></form>


    </div>

    <script  type="module" src="{{url_for('static',filename='js/firebase.js')}}"></script>
    <script type="module" src="{{url_for('static',filename='js/auth.js')}}"></script>
    
</body>
</html>
